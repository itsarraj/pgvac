[package]
name = "pgvac"
version = "0.1.0"
edition = "2021"
description = "Analyzes pg_stat_user_tables on a live Postgres for autovacuum health and flags tables needing manual attention"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/pgvac"
readme = "README.md"
keywords = ["postgres", "autovacuum", "dead-tuples", "monitoring", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "pgvac"
path = "src/lib.rs"

[[bin]]
name = "pgvac"
path = "src/main.rs"

[dependencies]
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
